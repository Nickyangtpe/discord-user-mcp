[project]
name = "discord-user-mcp"
version = "0.3.0"
description = "MCP server that exposes the Discord user (self-bot) HTTP API to AI agents behind a mandatory human approval gate"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "discord-user-mcp contributors" }]
keywords = ["mcp", "discord", "model-context-protocol", "user-token"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Communications :: Chat",
]

dependencies = [
  "mcp>=1.9,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
]

[project.scripts]
discord-user-mcp = "discord_user_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_user_mcp"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:discord_user_mcp.*"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
